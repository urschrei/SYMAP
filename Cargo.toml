[package]
name = "symap"
description = "A reimplementation of the SYMAP line-printer mapping system"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BlueOak-1.0.0"
publish = false

[dependencies]

[lib]
name = "symap"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "symap"
path = "src/main.rs"

# Small, self-contained WebAssembly for the browser front end.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
