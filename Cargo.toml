[package]
name = "symap"
description = "A reimplementation of the SYMAP line-printer mapping system"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BlueOak-1.0.0"
publish = false

[dependencies]
geo = { version = "0.32.0", default-features = false }
geojson = { version = "1.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# The browser boundary. wasm-bindgen is pinned exactly: the wasm-bindgen CLI
# that builds the site (scripts/build-web.sh, CI) must be the same version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
serde-wasm-bindgen = "0.6.5"

[lib]
name = "symap"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "symap"
path = "src/main.rs"

# Small, self-contained WebAssembly for the browser front end.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# wasm-bindgen needs the target_features section; it strips the rest.
strip = false
debug = false
