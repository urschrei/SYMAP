# Test, build the WebAssembly front end, and publish it to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --lib --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Install the wasm-bindgen CLI
        run: |
          v=$(cargo metadata --format-version 1 --locked --filter-platform wasm32-unknown-unknown \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-bindgen-$v-x86_64-unknown-linux-musl/wasm-bindgen"
          wasm-bindgen --version
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Build the site
        run: ./scripts/build-web.sh
      - name: Browser smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          # The runner image already has Chromium's system libraries; the
          # smoke test is headless, so the headless shell is enough.
          npx playwright install --only-shell chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory target/site &
          sleep 1
          node scripts/smoke-test.mjs http://127.0.0.1:8765/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
